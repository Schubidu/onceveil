name: Generate ALTCHA lockfile

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/generate-altcha-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit package lock to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi

          export LOCK_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/package-lock.json?ref=${HEAD_BRANCH}" --jq .sha)"
          python - <<'PY'
          import base64
          import json
          import os

          with open("package-lock.json", "rb") as handle:
              content = base64.b64encode(handle.read()).decode("ascii")

          with open("/tmp/package-lock-payload.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "message": "build: update ALTCHA lockfile",
                      "content": content,
                      "branch": os.environ["HEAD_BRANCH"],
                      "sha": os.environ["LOCK_SHA"],
                  },
                  handle,
              )
          PY

          gh api             --method PUT             "repos/${GITHUB_REPOSITORY}/contents/package-lock.json"             --input /tmp/package-lock-payload.json
