services:
  onceveil:
    build:
      context: .
    environment:
      ONCEVEIL_BRAND_NAME: ${ONCEVEIL_BRAND_NAME:-}
      ONCEVEIL_BRAND_LOGO: ${ONCEVEIL_BRAND_LOGO:-}
      ONCEVEIL_BRAND_FAVICON: ${ONCEVEIL_BRAND_FAVICON:-}
      ONCEVEIL_BRAND_ACCENT: ${ONCEVEIL_BRAND_ACCENT:-}
      ONCEVEIL_REVEAL_PROTECTION: ${ONCEVEIL_REVEAL_PROTECTION:-altcha}
      ONCEVEIL_ALTCHA_SECRET: ${ONCEVEIL_ALTCHA_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "${ONCEVEIL_BIND_ADDRESS:-127.0.0.1}:${ONCEVEIL_PORT:-3000}:3000"
    volumes:
      - onceveil-data:/data
    restart: unless-stopped

volumes:
  onceveil-data:
